    <text x="26" y="160" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5e6b78">Where, when, severity, bowel changes</text>
    <rect x="0" y="208" width="390" height="76" rx="20" fill="#f7e6df"/>
    <text x="26" y="240" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2933">Get urgent care</text>
