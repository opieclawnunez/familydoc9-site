<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Abdominal pain symptom map and care decision guide</title>
  <desc id="desc">Warm editorial illustration of a simple abdominal symptom map, hydration, food triggers, and red-flag care decisions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf7f1"/><stop offset="1" stop-color="#f1e1d4"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1f2933" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1200" height="720" rx="42" fill="url(#bg)"/>
  <circle cx="1020" cy="615" r="170" fill="#567b74" opacity=".12"/>
  <circle cx="168" cy="112" r="135" fill="#c96943" opacity=".10"/>
