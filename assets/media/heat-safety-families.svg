<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="60%" stop-color="#fceabb"/>
      <stop offset="100%" stop-color="#e8f0fe"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4956a"/>
      <stop offset="100%" stop-color="#a07850"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="650" cy="80" r="55" fill="#f7c948" opacity="0.9"/>
  <circle cx="650" cy="80" r="40" fill="#f5a623"/>
  <!-- Sun rays -->
  <g stroke="#f7c948" stroke-width="3" opacity="0.5">
    <line x1="650" y1="10" x2="650" y2="-10"/>
    <line x1="710" y1="30" x2="730" y2="15"/>
    <line x1="730" y1="80" x2="755" y2="80"/>
    <line x1="590" y1="30" x2="570" y2="15"/>
    <line x1="570" y1="80" x2="545" y2="80"/>
    <line x1="590" y1="130" x2="570" y2="145"/>
    <line x1="710" y1="130" x2="730" y2="145"/>
  </g>

  <!-- Ground / desert floor -->
  <rect x="0" y="340" width="800" height="110" fill="url(#ground)"/>

  <!-- Mountains -->
  <polygon points="0,340 80,260 160,340" fill="#b8865a" opacity="0.6"/>
  <polygon points="120,340 220,240 320,340" fill="#c4956a" opacity="0.5"/>
  <polygon points="500,340 600,250 700,340" fill="#b8865a" opacity="0.6"/>

  <!-- Cactus left -->
  <rect x="90" y="280" width="12" height="60" rx="6" fill="#4a7c59"/>
  <rect x="70" y="300" width="20" height="10" rx="5" fill="#4a7c59"/>
  <rect x="70" y="290" width="10" height="30" rx="5" fill="#4a7c59"/>
  <rect x="102" y="290" width="20" height="10" rx="5" fill="#4a7c59"/>
  <rect x="112" y="280" width="10" height="35" rx="5" fill="#4a7c59"/>

  <!-- Cactus right -->
  <rect x="680" y="290" width="10" height="50" rx="5" fill="#4a7c59"/>
  <rect x="660" y="305" width="20" height="8" rx="4" fill="#4a7c59"/>
  <rect x="660" y="295" width="8" height="28" rx="4" fill="#4a7c59"/>

  <!-- Family group - parent + child -->
  <!-- Parent -->
  <circle cx="370" cy="300" r="16" fill="#5b4633"/> <!-- head -->
  <rect x="358" y="316" width="24" height="30" rx="4" fill="#e85d4a"/> <!-- shirt -->
  <rect x="358" y="346" width="10" height="18" rx="3" fill="#3b5998"/> <!-- leg -->
  <rect x="372" y="346" width="10" height="18" rx="3" fill="#3b5998"/> <!-- leg -->
  <!-- Hat -->
  <ellipse cx="370" cy="288" rx="22" ry="6" fill="#f5deb3"/>
  <rect x="360" y="278" width="20" height="12" rx="4" fill="#f5deb3"/>
  <!-- Water bottle in hand -->
  <rect x="386" y="322" width="6" height="16" rx="3" fill="#4fc3f7" opacity="0.8"/>

  <!-- Child -->
  <circle cx="410" cy="316" r="12" fill="#5b4633"/> <!-- head -->
  <rect x="401" y="328" width="18" height="22" rx="4" fill="#7b68ee"/> <!-- shirt -->
  <rect x="401" y="350" width="8" height="14" rx="3" fill="#3b5998"/> <!-- leg -->
  <rect x="411" y="350" width="8" height="14" rx="3" fill="#3b5998"/> <!-- leg -->
  <!-- Hat -->
  <ellipse cx="410" cy="307" rx="16" ry="5" fill="#f5deb3"/>
  <rect x="403" y="298" width="14" height="10" rx="3" fill="#f5deb3"/>

  <!-- Shade structure / umbrella -->
  <rect x="440" y="270" width="4" height="70" fill="#8B7355"/>
  <path d="M400,270 Q442,230 485,270 Z" fill="#e85d4a" opacity="0.85"/>
  <path d="M405,270 Q442,235 480,270 Z" fill="#c0392b" opacity="0.3"/>

  <!-- Thermometer icon -->
  <rect x="248" y="260" width="8" height="40" rx="4" fill="#ddd"/>
  <circle cx="252" cy="305" r="6" fill="#e74c3c"/>
  <rect x="250" y="265" width="4" height="30" rx="2" fill="#e74c3c"/>
  <text x="242" y="258" font-family="Arial,sans-serif" font-size="11" fill="#c0392b" font-weight="bold">105°F</text>

  <!-- Warning triangle -->
  <polygon points="530,310 545,280 560,310" fill="#f39c12" stroke="#e67e22" stroke-width="1.5"/>
  <text x="542" y="303" font-family="Arial,sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">!</text>

  <!-- Title banner -->
  <rect x="180" y="140" width="440" height="50" rx="8" fill="rgba(0,0,0,0.55)"/>
  <text x="400" y="172" font-family="Arial,sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">Summer Heat Safety for West Valley Families</text>

  <!-- Subtitle -->
  <text x="400" y="200" font-family="Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.85)" text-anchor="middle">Know the signs. Protect your kids. Stay cool.</text>

  <!-- Bottom info bar -->
  <rect x="0" y="420" width="800" height="30" fill="rgba(0,0,0,0.4)"/>
  <text x="400" y="440" font-family="Arial,sans-serif" font-size="11" fill="#fff" text-anchor="middle">The Family Doc Blog — West Valley Health Intelligence — June 2026</text>
</svg>
