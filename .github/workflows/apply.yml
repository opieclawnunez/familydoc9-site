name: Apply site updates (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run update script
        run: python3 .github/scripts/apply.py
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --stat | tail -3
          git config user.name "docnunez-site-bot"
          git config user.email "docnunez-site-bot@users.noreply.github.com"
          git add -A
          git commit -m "Add analytics, title and meta fixes, and subscribe boxes"
          git push
          gh workflow run pages.yml
